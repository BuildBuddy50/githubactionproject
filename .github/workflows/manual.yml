name: Playwright Manual Execution

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: QA
        type: choice
        options:
          - QA
          - UAT
          - PROD

      browser:
        description: "Select Browser"
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      tags:
        description: "Playwright Tag (@smoke, @regression)"
        required: false
        default: ""

      workers:
        description: "Number of Workers"
        required: true
        default: "2"

      headed:
        description: "Run in Headed Mode?"
        required: true
        default: false
        type: boolean

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Browsers
        run: npx playwright install --with-deps

      - name: Execute Playwright Tests
        run: |
          npx playwright test \
          --project=${{ github.event.inputs.browser }} \
          --grep="${{ github.event.inputs.tags }}" \
          --workers=${{ github.event.inputs.workers }} \
          ${{ github.event.inputs.headed == 'true' && '--headed' || '' }}
        env:
          ENV: ${{ github.event.inputs.environment }}

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-Report
          path: playwright-report/
